 aria-label="關閉圖片檢視器">關閉 <span aria-hidden="true">×</span></button></div><div class="viewer-stage"><p id="viewer-status" role="status"></p><img id="viewer-image" alt="" draggable="false"><button class="viewer-prev" aria-label="上一張圖片"><span aria-hidden="true">←</span></button><button class="viewer-next" aria-label="下一張圖片"><span aria-hidden="true">→</span></button></div><p class="viewer-caption" id="viewer-caption"></p></dialog><script>// Local DOM/CSS interpretations of the referenced gallery interactions.
// The circular index uses a locally adapted WebGL engine; no React runtime or external fonts.
function setupPhotography(config,tr) {
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const storage={get(key){try{return JSON.parse(sessionStorage.getItem(key));}catch{return null;}},set(key,value){try{sessionStorage.setItem(key,JSON.stringify(value));}catch{}}};
  const watch=img=>{
    if(img.dataset.photoWatched)return;
    img.dataset.photoWatched='true';
    const picture=img.closest('picture'),host=img.closest('.photo-cover-image,.accordion-image,.gallery-item');
    if(!picture||!host)return;
    const feedback=document.createElement('div');feedback.className='photo-picture-feedback';
    const status=document.createElement('p');status.setAttribute('role','status');
    const retry=document.createElement('button');retry.hidden=true;retry.textContent=tr('Try again','重試');
    retry.setAttribute('aria-label',tr('Retry photograph: ','重新載入照片：')+img.alt);
    // Feedback must be a sibling of an image link/button, never a nested button.
    const surface=host.matches('.accordion-image')?host.parentElement:host.matches('.photo-cover-image')?host.closest('.photo-cover'):host;
    surface.append(feedback);feedback.append(status,retry);
    let timer,visible=false;
    const busy=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!img.complete){status.textContent=tr('Loading photograph…','照片載入中…');host.setAttribute('aria-busy','true');}},300);};
    const ready=()=>{clearTimeout(timer);status.textContent='';retry.hidden=true;host.removeAttribute('aria-busy');host.classList.remove('has-photo-error');picture.classList.add('is-loaded');};
    img.addEventListener('load',ready);
    const failed=()=>{
      const source=picture.querySelector('source');
      if(source){source.remove();img.src=img.getAttribute('src');busy();return;}
      clearTimeout(timer);host.removeAttribute('aria-busy');host.classList.add('has-photo-error');status.textContent=tr('This photograph could not load.','暫時未能載入這張照片。');retry.hidden=false;
    };
    img.addEventListener('error',failed);
    retry.addEventListener('click',event=>{event.stopPropagation();retry.hidden=true;status.textContent='';(host.matches('button')?host:host.querySelector('button')||surface.querySelector('a')).focus({preventScroll:true});const target=new URL(img.src);target.searchParams.set('retry',Date.now());img.src=target.href;busy();});
    if(img.complete&&img.naturalWidth)ready();
    else if(img.complete&&img.currentSrc)queueMicrotask(failed);
    else if('IntersectionObserver' in window){
      const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)&&!visible){visible=true;busy();observer.disconnect();}},{rootMargin:'100px'});observer.observe(host);
    }else busy();
  };
  document.querySelectorAll('.accordion-card img,.gallery-item img').forEach(watch);
  const root=document.querySelector('[data-photo-carousel]');
  if(!root)return {watch};
  let gallery;
  const syncPhotoScroll=setupPhotoSequence(root,root.querySelectorAll('[data-photo-card]').length,index=>{
    gallery.select(index,{fromScroll:true});
  });
  const dependencies={watch,storage,reduced,syncPhotoScroll};
  gallery=root.dataset.photoCarousel==='accordion'
    ?setupAccordionGallery(config,tr,dependencies)
    :setupCircularGallery(config,tr,dependencies);
  return gallery;
}

// Native vertical scrolling drives the finite sequence while the gallery stays in view.
function setupPhotoSequence(stage,count,select) {
  const section=stage.parentElement;
  const header=document.querySelector('.site-header');
  section.classList.add('photo-sequence');
  stage.classList.add('photo-sequence-stage');
  let step=0,start=0,end=0,frame=0,previousY=scrollY;
  const measure=()=>{

  const wrap=index=>(index%cards.length+cards.length)%cards.length;

    const template=card.querySelector('template[data-photo-picture]');
    if(template){template.replaceWith(template.content.cloneNode(true));const image=card.querySelector('img');image.loading='eager';watch(image);}

  let galleryCount=18;
  let loading=false;
  const itemById=new Map(config.items.map((item,index)=>[item.id,{...item,index}]));
  const {projectItems,carousels}=config.page==='design'?setupDesignCarousels(config.items,tr):{projectItems:new Map(),carousels:new Map()};
  const photoUI=config.page==='photography'?setupPhotography(config,tr):null;
  const masonry=config.photoMode==='all'&&gallery?setupMasonryGallery(gallery,{items:itemById,tr}):null;
  const makeGalleryItem=item=>{
    const button=document.createElement('button');
    button.className='gallery-open';
    button.dataset.viewerId=item.id;
    button.setAttribute('aria-label',tr('Open: ','開啟：')+item.alt);
    const picture=document.createElement('picture');picture.className='picture';picture.style.backgroundImage=`url('${item.placeholder}')`;
    const source=document.createElement('source');source.type='image/webp';source.srcset=item.webp.map(p=>`${p.src} ${p.width}w`).join(', ');source.sizes='(max-width:767px) calc(100vw - 40px), 240px';
    const img=document.createElement('img');img.width=item.width;img.height=item.height;img.alt=item.alt;img.loading='lazy';img.decoding='async';img.src=item.fallback;
    picture.append(source,img);button.append(picture);const frame=document.createElement('div');frame.className='gallery-item'+(item.width/item.height>1.15?' landscape':'');frame.dataset.viewerId=item.id;frame.append(button);photoUI?.watch(img);return frame;
  };
  const layoutGallery=()=>{
    if(!gallery)return;
    if(masonry){masonry.sync();return;}
    const style=getComputedStyle(gallery);
    const gap=parseFloat(style.rowGap);
    const row=parseFloat(style.gridAutoRows);
    for(const button of gallery.children){
      const item=itemById.get(button.dataset.viewerId);
      const height=button.getBoundingClientRect().width*item.height/item.width;
      button.style.gridRowEnd=`span ${Math.ceil((height+gap)/(row+gap))}`;
    }
  };
  const loadBatch=()=>{
    if(loading||galleryCount>=config.items.length)return;
    loading=true;
    gallery.setAttribute('aria-busy','true');
    const batch=config.items.slice(galleryCount,galleryCount+18);
    const fragment=document.createDocumentFragment();
    for(const item of batch)fragment.append(makeGalleryItem(item));
    gallery.append(fragment);
    galleryCount+=batch.length;
    layoutGallery();
    document.getElementById('gallery-status').textContent=`${galleryCount} / ${config.items.length} ${tr('added to gallery','張已加入相簿')}`;
    if(galleryCount>=config.items.length){
      loadMore.disabled=true;
      loadMore.textContent=tr('You’ve seen them all. Thank you.','已經看完全部照片，謝謝你的觀看。');
    }
    gallery.removeAttribute('aria-busy');
    loading=false;
  };
  if(gallery) {
    layoutGallery();
    if(!masonry)new ResizeObserver(layoutGallery).observe(gallery);
    loadMore.addEventListener('click',loadBatch);
    if('IntersectionObserver' in window) {
      const observer=new IntersectionObserver(entries=>{
        if(entries.some(e=>e.isIntersecting))loadBatch();
        if(galleryCount>=config.items.length)observer.disconnect();
      },{rootMargin:'450px 0px'});
      observer.observe(document.getElementById('gallery-sentinel'));
    }
  }
  const dialog=document.getElementById('lightbox');
  if(dialog) {
    const image=document.getElementById('viewer-image');
    const status=document.getElementById('viewer-status');
    const prev=dialog.querySelector('.viewer-prev');
    const next=dialog.querySelector('.viewer-next');
    const photoViewer=config.page==='photography';
    let photoTimer;
    let retry;
    if(photoViewer){
      const feedback=document.createElement('div');feedback.className='viewer-feedback';status.before(feedback);feedback.append(status);
      retry=document.createElement('button');retry.className='viewer-retry';retry.hidden=true;retry.textContent=tr('Try again','重試');feedback.append(retry);
    }
    let active=0,trigger=null,preloads=[],activeItems=config.items,activeProject=null,viewerVersion=0,viewerPosition=null;
    const show=index=>{
      active=(index+activeItems.length)%activeItems.length;
      const item=activeItems[active],version=++viewerVersion;
      clearTimeout(photoTimer);
      if(retry)retry.hidden=true;
      if(photoViewer){
        status.textContent='';dialog.classList.add('is-photo-loading');
        photoTimer=setTimeout(()=>{if(version===viewerVersion)status.textContent=tr('Loading photograph…','照片載入中…');},300);
      }else status.textContent=tr('Loading image…','圖片載入中…');
      image.onload=()=>{if(version===viewerVersion){clearTimeout(photoTimer);status.textContent='';dialog.classList.remove('is-photo-loading');}};
      image.onerror=()=>{
        if(version!==viewerVersion)return;
        if((activeProject||photoViewer)&&new URL(image.src,location.href).pathname!==item.fallback){image.src=item.fallback;return;}
        clearTimeout(photoTimer);
        status.textContent=tr('This image could not load. Try another image.','暫時未能載入圖片，請瀏覽另一張。');
        if(retry){status.textContent=tr('This photograph could not load. Please try again.','暫時未能載入這張照片，請重試。');retry.hidden=false;}
      };
      image.src=item.large;
      image.alt=item.alt;
      const counter=document.getElementById('viewer-counter');
      counter.textContent=`${String(active+1).padStart(2,'0')} / ${activeProject?String(activeItems.length).padStart(2,'0'):activeItems.length}`;
      counter.hidden=!!activeProject&&activeItems.length===1;
      prev.hidden=next.hidden=activeItems.length===1;
      const projectLabel=document.getElementById('viewer-project');
      if(projectLabel)projectLabel.textContent=`PROJECT / ${item.projectNumber||item.projectId} · ${item.projectTitle}`;
      dialog.setAttribute('aria-label',activeProject?`${item.projectTitle} — ${tr('Image viewer','圖片檢視器')}`:tr('Image viewer','圖片檢視器'));
      document.getElementById('viewer-caption').textContent=photoViewer?'':item.alt;
      const neighbors=new Set([-1,1].map(delta=>(active+delta+activeItems.length)%activeItems.length));
      neighbors.delete(active);
      preloads=[...neighbors].map(index=>{const neighbor=new Image();neighbor.src=activeItems[index].large;return neighbor;});
    };
    retry?.addEventListener('click',()=>{const item=activeItems[active];show(active);const target=new URL(item.fallback,location.href);target.searchParams.set('retry',Date.now());image.src=target.href;document.getElementById('viewer-close').focus();});
    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-viewer-id]');
      if(!button)return;
      const item=itemById.get(button.dataset.viewerId);
      if(!item)return;
      trigger=button;
      activeProject=item.projectId||null;
      activeItems=activeProject?projectItems.get(activeProject):(masonry?masonry.viewerItems():config.items);
      viewerPosition={x:scrollX,y:scrollY};
      show(activeItems.findIndex(entry=>entry.id===item.id));
      dialog.showModal();
      document.body.classList.add('modal-open');
      updateBackToTop();
      document.getElementById('viewer-close').focus();
    });
    document.getElementById('viewer-close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('close',()=>{
      viewerVersion++;clearTimeout(photoTimer);
      if(activeProject)carousels.get(activeProject)?.select(active,{preload:false});
      document.body.classList.remove('modal-open');
      if(viewerPosition)window.scrollTo({left:viewerPosition.x,top:viewerPosition.y,behavior:'instant'});
      trigger?.focus({preventScroll:true});updateBackToTop();
    });
    prev.addEventListener('click',()=>show(active-1));next.addEventListener('click',()=>show(active+1));
    dialog.addEventListener('keydown',event=>{
      if(event.key==='ArrowLeft'){event.preventDefault();show(active-1);}
      if(event.key==='ArrowRight'){event.preventDefault();show(active+1);}
      if(event.key==='Tab'){
        const focusables=[...dialog.querySelectorAll('button')].filter(button=>!button.hidden&&!button.disabled);
        const first=focusables[0],last=focusables.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
      }
    });
    let touch=null;
    image.addEventListener('touchstart',event=>{touch=event.touches.length===1?{x:event.touches[0].clientX,y:event.touches[0].clientY}:null;},{passive:true});
    image.addEventListener('touchend',event=>{
      if(!touch)return;
      const dx=event.changedTouches[0].clientX-touch.x,dy=event.changedTouches[0].clientY-touch.y;
      if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)show(active+(dx<0?1:-1));
      touch=null;
    },{passive:true});
    image.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
  }
  const footer=document.getElementById('portfolio-footer');
  if(footer){
    const footerMotion=matchMedia('(prefers-reduced-motion: reduce)');
    let revealFrame=0;
    let nearFooter=true;
    let previousProgress;

    const updateFooterReveal=()=>{
      revealFrame=0;
      if(footerMotion.matches||document.body.classList.contains('modal-open'))return;
      const bounds=footer.getBoundingClientRect();
      // Let part of the footer enter the viewport before revealing its content.
      const end=Math.max(1,Math.min(bounds.height,innerHeight*.9));
      const start=Math.min(120,end*.35);
      const entered=innerHeight-bounds.top;
      const progress=Math.max(0,Math.min(1,(entered-start)/(end-start)));
      const eased=progress*progress*(3-2*progress);
      const opacity=eased.toFixed(4);
      if(opacity!==previousProgress){
        footer.style.setProperty('--footer-reveal',opacity);
        previousProgress=opacity;
      }
    };
    const scheduleFooterReveal=()=>{
      if(!revealFrame)revealFrame=requestAnimationFrame(updateFooterReveal);
    };
    updateFooterReveal();
    footer.setAttribute('data-scroll-reveal','');

    if('IntersectionObserver' in window){
      const observer=new IntersectionObserver(([entry])=>{
        nearFooter=entry.isIntersecting;
        scheduleFooterReveal();
      },{rootMargin:'160px'});
      observer.observe(footer);
    }
    if('ResizeObserver' in window)new ResizeObserver(scheduleFooterReveal).observe(footer);
    window.addEventListener('scroll',()=>{if(nearFooter)scheduleFooterReveal();},{passive:true});
    window.addEventListener('resize',scheduleFooterReveal);
    window.addEventListener('pageshow',scheduleFooterReveal);
    footerMotion.addEventListener('change',scheduleFooterReveal);
  }
  const thanksButton=footer?.querySelector('[data-footer-thanks-cycle]');
  if(thanksButton){
    const stage=thanksButton.closest('[data-footer-message]');
    let pulseTimer,nearFrame=0,pointer=null,footerVisible=false;
    const clearPulse=()=>{clearTimeout(pulseTimer);stage.classList.remove('is-engaged');};
    const pulse=()=>{clearTimeout(pulseTimer);stage.classList.add('is-engaged');pulseTimer=setTimeout(clearPulse,1100);};
    const clearNear=()=>{cancelAnimationFrame(nearFrame);nearFrame=0;pointer=null;stage.classList.remove('is-near');};
    const visibility=new IntersectionObserver(entries=>{footerVisible=entries[0].isIntersecting;if(!footerVisible)clearNear();},{rootMargin:'48px'});
    visibility.observe(footer);
    document.addEventListener('pointermove',event=>{
      if(event.pointerType==='touch'||!footerVisible)return;
      pointer={x:event.clientX,y:event.clientY};
      if(nearFrame)return;
      nearFrame=requestAnimationFrame(()=>{
        nearFrame=0;if(!pointer)return;
        const box=stage.getBoundingClientRect(),reach=24;
        stage.classList.toggle('is-near',pointer.x>=box.left-reach&&pointer.x<=box.right+reach&&pointer.y>=box.top-reach&&pointer.y<=box.bottom+reach);
      });
    },{passive:true});
    document.addEventListener('pointerleave',clearNear);
    stage.addEventListener('pointerdown',pulse,{passive:true});
    stage.addEventListener('pointercancel',clearPulse,{passive:true});
    window.addEventListener('scroll',clearNear,{passive:true});
    window.addEventListener('blur',()=>{clearNear();clearPulse();});
    const word=document.querySelector('[data-footer-thanks]');
    const words=tr(['Thank You','Thanks'],['多謝','謝謝']);let index=0;
    const updateLabel=()=>thanksButton.setAttribute('aria-label',tr('Say thanks another way. Currently: ','換個方式說謝謝。目前：')+words[index]);
    thanksButton.hidden=false;updateLabel();
    thanksButton.addEventListener('click',()=>{index=(index+1)%words.length;word.textContent=words[index];updateLabel();});
  }
  if(config.page==='contact')setupContact(tr);
})();
</script></body></html>
